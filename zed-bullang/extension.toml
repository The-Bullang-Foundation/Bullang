id = "bullang"
name = "Bullang"
description = "Bullang language support: syntax highlighting and the Bullarchy language server."
version = "1.0.0"
schema_version = 1
authors = ["The Bullang Foundation"]
repository = "https://github.com/The-Bullang-Foundation/Bullang"

# The grammar lives in this same repository, under tree-sitter-bullang/.
#
# `path` names a subdirectory inside the cloned repository, so a grammar does
# not need a repository of its own. `repository` and `rev` are both required
# and Zed clones at that revision, so `rev` must be a commit of *this*
# repository that already contains the grammar. Changing the grammar therefore
# takes two commits: one for the grammar, then one that pins its SHA here.
[grammars.bullang]
repository = "https://github.com/The-Bullang-Foundation/Bullang"
rev = "207a03df37270f3022e504ad4a3f6640164eb481"
path = "tree-sitter-bullang"

# `languages` must match the `name` in languages/bullang/config.toml exactly.
[language_servers.bullarchy]
name = "Bullarchy"
languages = ["Bullang"]
